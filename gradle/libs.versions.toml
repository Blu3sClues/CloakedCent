# Pocket Budget dependency catalog.
#
# Versions were chosen together, not independently. Constraints that pin them:
# - compileSdk 36 (latest installed platform). Compose 1.12+, core 1.19+ and
#   lifecycle 2.11+ require compileSdk 37, so they are held back deliberately.
# - AGP 9.4.x requires Gradle >= 9.6.0 (wrapper: 9.7.1).
# - AGP 9 compiles Kotlin itself ("built-in Kotlin"); the Compose compiler
#   plugin version must equal the Kotlin version, and it also selects the KGP
#   version AGP uses.
# - KSP 2.3.10+ is required for Kotlin 2.4 and AGP 9 built-in Kotlin.
# - SQLCipher 4.19.x depends on androidx.sqlite 2.7.0 and ships 16 KB-aligned
#   native libraries.
# - room-testing 2.8.5 needs kotlinx-serialization 1.8.1+, while lifecycle
#   2.10 brings 1.7.3 into the app; AGP aligns test classpaths to the app, so
#   the app is constrained to 1.8.1 (see app/build.gradle.kts).
# - Compose 1.11's test library brings Espresso 3.5.0, which crashes on
#   API 35+; Espresso 3.7.0 is pinned for instrumented tests.
# Do not bump one of these without re-checking the others.

[versions]
agp = "9.4.1"
kotlin = "2.4.21"
ksp = "2.3.12"
room = "2.8.5"
sqlcipher = "4.19.1"
androidxSqlite = "2.7.0"
composeBom = "2026.06.01"
activityCompose = "1.13.0"
coreKtx = "1.18.0"
lifecycle = "2.10.0"
coroutines = "1.11.0"
kotlinxSerialization = "1.8.1"
junit = "4.13.2"
espresso = "3.7.0"
androidxTestExtJunit = "1.3.0"
androidxTestRunner = "1.7.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
androidx-sqlite = { group = "androidx.sqlite", name = "sqlite", version.ref = "androidxSqlite" }
sqlcipher-android = { group = "net.zetetic", name = "sqlcipher-android", version.ref = "sqlcipher" }

kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-core", version.ref = "kotlinxSerialization" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }
