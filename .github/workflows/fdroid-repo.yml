# Builds a signed release and publishes it as an F-Droid repository on GitHub Pages.
# Run by hand from the Actions tab, on main. Clients only offer the build as an update
# if versionCode went up, so raise it in app/build.gradle.kts before publishing.
name: Publish F-Droid repo

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fdroid-repo
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4

      - name: Build the signed release APK
        env:
          APK_KEYSTORE_B64: ${{ secrets.APK_KEYSTORE_B64 }}
          CLOAKEDCENT_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
        run: |
          export CLOAKEDCENT_KEYSTORE="$RUNNER_TEMP/app-signing.p12"
          base64 -d <<< "$APK_KEYSTORE_B64" > "$CLOAKEDCENT_KEYSTORE"
          ./gradlew :app:assembleRelease --no-daemon
          rm "$CLOAKEDCENT_KEYSTORE"

      - name: Install the F-Droid server tools
        run: |
          sudo add-apt-repository -y ppa:fdroid/fdroidserver
          sudo apt-get update
          sudo apt-get install -y fdroidserver python3-venv
          # The packaged androguard 3 stops on resources.arsc from current build tools; 4 only warns.
          python3 -m venv --system-site-packages "$RUNNER_TEMP/fdroid-env"
          "$RUNNER_TEMP/fdroid-env/bin/pip" install androguard==4.1.4

      - name: Build the signed repository index
        working-directory: fdroid
        env:
          REPO_KEYSTORE_B64: ${{ secrets.REPO_KEYSTORE_B64 }}
          REPO_KEYSTORE_PASSWORD: ${{ secrets.REPO_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p repo/icons
          cp ../app/build/outputs/apk/release/app-release.apk repo/com.cloakedcent.app.apk
          cp metadata/com.cloakedcent.app/en-US/icon.png repo/icons/cloakedcent.png
          base64 -d <<< "$REPO_KEYSTORE_B64" > keystore.p12
          chmod 600 config.yml keystore.p12
          {
            echo "keystore: keystore.p12"
            echo "keystorepass: $REPO_KEYSTORE_PASSWORD"
            echo "keypass: $REPO_KEYSTORE_PASSWORD"
          } >> config.yml
          "$RUNNER_TEMP/fdroid-env/bin/python" /usr/bin/fdroid update --verbose
          rm keystore.p12 config.yml

      - name: Prepare the site
        run: |
          mkdir -p site/fdroid
          mv fdroid/repo site/fdroid/repo

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
